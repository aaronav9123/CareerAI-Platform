<!DOCTYPE html>
<html>
<head>

<title>Register | CareerAI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='extras.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='scroll-effects.css') }}">

</head>

<body>

<div class="auth-container">

<div class="auth-card" data-reveal="zoom">

<h2>Create Account</h2>

<p>Join CareerAI and discover your ideal career path.</p>

{% include '_flash.html' %}

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
name="name"
placeholder="Enter your name"
required>

</div>

<div class="form-group">

<label>Email Address</label>

<input
type="email"
name="email"
placeholder="Enter your email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="At least 8 characters"
minlength="8"
required>

</div>

<div class="form-group">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm password"
required>

</div>

<button type="submit">

Create Account

</button>

</form>

<div class="bottom-text">
<br>
Already have an account?

<a href="/login">Login</a>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='scroll.js') }}" defer></script>

</body>
</html>
