<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CareerAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='extras.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='scroll-effects.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card" data-reveal="zoom">

        <h2>Forgot your password?</h2>
        <p>Enter the email you registered with and we'll send you a reset link.</p>
        {% include '_flash.html' %}
        <form method="POST" action="/forgot-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <button type="submit">Send reset link</button>
        </form>
        <div class="bottom-text"><a href="/login">Back to login</a></div>

    </div>

</div>

<script src="{{ url_for('static', filename='scroll.js') }}" defer></script>

</body>
</html>
