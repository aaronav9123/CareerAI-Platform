<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CareerAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='extras.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='scroll-effects.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card" data-reveal="zoom">

        <h2>Welcome Back 👋</h2>

        <p>Login to continue your CareerAI journey.</p>

        {% include '_flash.html' %}

        {% if unverified_email %}
        <form action="/resend-verification" method="POST" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="email" value="{{ unverified_email }}">
            <button type="submit" class="link-btn">Resend verification email</button>
        </form>
        {% endif %}

        <form action="/login" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="bottom-text" style="margin-bottom:8px;">
            <a href="/forgot-password">Forgot your password?</a>
        </div>

        <div class="bottom-text">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='scroll.js') }}" defer></script>

</body>
</html>
