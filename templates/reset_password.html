<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CareerAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='extras.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='scroll-effects.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card" data-reveal="zoom">

        <h2>Choose a new password</h2>
        <p>Use at least 8 characters.</p>
        {% include '_flash.html' %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group"><label>New password</label>
                <input type="password" name="password" minlength="8" placeholder="New password" required></div>
            <div class="form-group"><label>Confirm password</label>
                <input type="password" name="confirm_password" minlength="8" placeholder="Repeat password" required></div>
            <button type="submit">Update password</button>
        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='scroll.js') }}" defer></script>

</body>
</html>
